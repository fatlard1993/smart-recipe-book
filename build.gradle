plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.17'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// e.g. ./gradlew runClient -PquickJoin=localhost:25565
// Appended in doFirst: loom composes its own game args during configuration,
// and this must land after them, right before exec
if (project.hasProperty('quickJoin')) {
	tasks.named('runClient') {
		doFirst {
			args('--quickPlayMultiplayer', project.property('quickJoin').toString())
			logger.lifecycle("runClient game args: {}", args)
			if (project.hasProperty('quickJoinMaxHeap')) {
				jvmArgs("-Xmx${project.property('quickJoinMaxHeap')}")
			}
		}
	}
}

base {
	archivesName = project.archives_base_name
}

repositories {}

loom {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional: a Pandorical screen can declare itself a crafting station, and this book is what
	// answers for one. Compile-only and never bundled, guarded at runtime, so this mod still
	// works alone on a vanilla server.
	//
	// Resolved by the version Pandorical declares rather than one written down here: Gradle never
	// clears build/libs, so a name pinned by hand keeps compiling green against a jar an old
	// build left behind.
	def pandoricalProperties = file("../pandorical/gradle.properties")
	if (pandoricalProperties.exists()) {
		def pandoricalVersion = new Properties().with {
			pandoricalProperties.withInputStream { load(it) }
			getProperty("mod_version")?.trim()
		}
		def pandoricalJar = file("../pandorical/build/libs/pandorical-${pandoricalVersion}.jar")
		if (!pandoricalJar.exists()) {
			throw new GradleException("pandorical ${pandoricalVersion} is not built. Run" +
				" `mc-build pandorical` first - this mod compiles against its screen API.")
		}
		compileOnly files(pandoricalJar)
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {}
}
