plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.17'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// e.g. ./gradlew runClient -PquickJoin=localhost:25565
// Appended in doFirst: loom composes its own game args during configuration,
// and this must land after them, right before exec
if (project.hasProperty('quickJoin')) {
	tasks.named('runClient') {
		doFirst {
			args('--quickPlayMultiplayer', project.property('quickJoin').toString())
			logger.lifecycle("runClient game args: {}", args)
			if (project.hasProperty('quickJoinMaxHeap')) {
				jvmArgs("-Xmx${project.property('quickJoinMaxHeap')}")
			}
		}
	}
}

base {
	archivesName = project.archives_base_name
}

repositories {}

loom {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional: a Pandorical screen can declare itself a crafting station, and this book is what
	// answers for one. Compile-only and never bundled, guarded at runtime, so this mod still
	// works alone on a vanilla server.
	//
	// Resolved by the version Pandorical declares rather than one written down here: Gradle never
	// clears build/libs, so a name pinned by hand keeps compiling green against a jar an old
	// build left behind.
	def pandoricalProperties = file("../pandorical/gradle.properties")
	if (pandoricalProperties.exists()) {
		def pandoricalVersion = new Properties().with {
			pandoricalProperties.withInputStream { load(it) }
			getProperty("mod_version")?.trim()
		}
		def pandoricalJar = file("../pandorical/build/libs/pandorical-${pandoricalVersion}.jar")
		if (!pandoricalJar.exists()) {
			throw new GradleException("pandorical ${pandoricalVersion} is not built. Run" +
				" `mc-build pandorical` first - this mod compiles against its screen API.")
		}
		compileOnly files(pandoricalJar)
	}
}

// Fabric tests these predicates against the loader's *normalized* game version,
// not Mojang's id: 26.3-snapshot-10 is compared as 26.3-alpha.10. So a floor of
// ">=26.3" is false on every 26.3 snapshot, and writing the obvious thing makes
// the mod refuse to load on the version it was built for. Derived from the pin
// rather than written into the manifest, so the two cannot drift apart.
def mcFloor = project.minecraft_version
	.replaceFirst(/-snapshot-/, '-alpha.')
	.replaceFirst(/-pre-/, '-pre.')
	.replaceFirst(/-rc-/, '-rc.')
// The trailing dash is load-bearing: "<26.4" would still admit 26.4's snapshots,
// because a prerelease sorts below its own release.
def mcParts = mcFloor.tokenize('.-')
def minecraftDependency = ">=${mcFloor} <${mcParts[0]}.${(mcParts[1] as int) + 1}-"
// The +26.3 build tag is ignored in comparison; the floor is the number.
def fabricApiFloor = ">=" + project.fabric_version.replaceFirst(/\+.*$/, '')

processResources {
	inputs.property "version", project.version
	inputs.property "minecraftDependency", minecraftDependency
	inputs.property "loaderVersion", project.loader_version
	inputs.property "fabricApiVersion", fabricApiFloor

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
		       "minecraftDependency": minecraftDependency,
		       "loaderVersion": project.loader_version,
		       "fabricApiVersion": fabricApiFloor
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	// The readme rides in the jar beside the licence, so a server can show it in-game.
	from("README.md") {
		rename { "README_${project.base.archivesName.get()}.md" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {}
}
